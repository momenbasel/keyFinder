<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>KeyFinder — film title</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1280px;
      height: 720px;
      background: #05070c;
      display: grid;
      place-items: center;
      font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .card { text-align: center; }
    .icon { width: 76px; height: 76px; }
    h1 {
      color: #fff;
      font-size: 46px;
      font-weight: 700;
      letter-spacing: .28em;
      margin-top: 20px;
      padding-left: .28em; /* optical centering with tracking */
    }
    .tag {
      color: #f5a524;
      font-size: 14px;
      letter-spacing: .22em;
      margin-top: 12px;
    }
    .spec {
      color: #525d70;
      font-size: 11px;
      letter-spacing: .16em;
      margin-top: 26px;
    }
    .spec b { color: #8b96a8; font-weight: 600; }
    .led {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #3ddc97;
      margin-right: 8px;
      vertical-align: 1px;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="icon" src="../icons/icon128.png" alt="">
    <h1>KEYFINDER</h1>
    <div class="tag">// PASSIVE SECRET DISCOVERY</div>
    <div class="spec"><span class="led"></span><b>v2.2.1</b> &nbsp;·&nbsp; 80+ PATTERNS &nbsp;·&nbsp; 10 ATTACK SURFACES &nbsp;·&nbsp; LOCAL-ONLY</div>
  </div>
</body>
</html>
